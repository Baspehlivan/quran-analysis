name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quran
          POSTGRES_PASSWORD: quran
          POSTGRES_DB: quran_analysis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quran -d quran_analysis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://quran:quran@localhost:5432/quran_analysis
      QURAN_ANALYSIS_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Migrate and load canonical Tanzil when empty
        shell: bash
        run: |
          set -euo pipefail
          alembic upgrade head
          if [ "$(quran source list | python -c 'import json, sys; print(len(json.load(sys.stdin)))')" = "0" ]; then
            quran source register data/raw/tanzil-uthmani_1.1_tanzil-text-with-ayah-numbers-v1_bf4f57b968d03f4131c070b1e285da9be0e0a108a21c910e872801ca273312c8.txt --name tanzil-uthmani --version 1.1 --format tanzil-text-with-ayah-numbers-v1
            quran ingest 1
          fi
      - name: Lint, type check, test, and verify
        run: |
          set -euo pipefail
          ruff check .
          mypy src
          pytest -q
          quran validate 1
          quran verify
